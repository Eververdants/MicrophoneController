name: build-and-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

# ============================================================
# Job 1: Build desktop (Tauri) — only on tag push
# ============================================================
build-desktop:
  if: startsWith(github.ref, 'refs/tags/v')
  strategy:
    fail-fast: false
    matrix:
      include:
        - platform: windows-latest
          args: ''
        - platform: macos-latest
          args: '--target universal-apple-darwin'
        - platform: ubuntu-22.04
          args: ''
  runs-on: ${{ matrix.platform }}
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform == 'macos-latest' && 'universal-apple-darwin' || '' }}

    - name: Install system deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libxdo-dev \
          libssl-dev \
          libgtk-3-dev \
          libsoup-3.0-dev

    - name: Install Node deps
      run: npm ci

    - name: Build Tauri
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: ${{ github.ref_name }}
        releaseBody: 'See the assets to download and install this version.'
        releaseDraft: false
        prerelease: false
        args: ${{ matrix.args }}
        projectPath: .
        tauriScript: npm run tauri

# ============================================================
# Job 2: Build website
# ============================================================
build-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website deps
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

# ============================================================
# Job 3: Deploy GitHub Pages
# ============================================================
deploy-pages:
  needs: build-website
  if: always() && !cancelled() && needs.build-website.result == 'success'
  runs-on: ubuntu-latest
  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
  steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
