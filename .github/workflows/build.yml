name: build-and-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 1: 打包桌面端 (仅 tag 推送时执行)
  # ============================================================
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
          else
            SEP=":"
          fi
          pyinstaller --noconsole --onefile --name MicrophoneController \
            --add-data "app/frontend${SEP}frontend" \
            --add-data "icon.png${SEP}." \
            --icon "icon.png" \
            app/app.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "MicrophoneController-Windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "dist\MicrophoneController.exe" -DestinationPath $zip -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          zip -j "MicrophoneController-macOS-${{ github.ref_name }}.zip" "dist/MicrophoneController"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          zip -j "MicrophoneController-Linux-${{ github.ref_name }}.zip" "dist/MicrophoneController"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: MicrophoneController-*.zip

  # ============================================================
  # Job 2: 构建官网
  # ============================================================
  build-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  # ============================================================
  # Job 3: 部署 GitHub Pages
  # ============================================================
  deploy-pages:
    needs: build-website
    if: always() && !cancelled() && needs.build-website.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # Job 4: 创建 GitHub Release (仅 tag 推送时执行)
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, build-website]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.zip
          generate_release_notes: true
