<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicController</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Space+Mono&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #131210; margin: 0; }
  </style>
</head>
<body>
  <div id="app">

    <div class="rack-rail"></div>

    <div id="status-card" class="module module-status">
      <div class="module-label">
        <span class="label-text" data-i18n="module_input">input</span>
        <span class="label-divider"></span>
        <span class="label-channel" data-i18n="module_input_ch">ch 1</span>
      </div>
      <div class="status-body">
        <div class="status-visual">
          <div id="vu-strip" class="vu-strip">
            <div class="vu-segment" data-index="0"></div>
            <div class="vu-segment" data-index="1"></div>
            <div class="vu-segment" data-index="2"></div>
            <div class="vu-segment" data-index="3"></div>
            <div class="vu-segment" data-index="4"></div>
            <div class="vu-segment" data-index="5"></div>
            <div class="vu-segment" data-index="6"></div>
            <div class="vu-segment" data-index="7"></div>
          </div>
          <div class="status-meta">
            <div id="status-indicator" class="pilot-led pilot-on"></div>
            <div class="status-label-group">
              <span class="status-label" data-i18n="status_mute_label">mute</span>
              <span id="status-text" class="status-value">on</span>
            </div>
          </div>
        </div>
        <div class="status-controls">
          <button id="btn-toggle" class="switch-toggle" type="button">
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
            <span id="btn-toggle-label" class="switch-label">off</span>
          </button>
          <button id="btn-mute" class="btn-rack btn-rack-mute" type="button">
            <span class="btn-rack-inner" data-i18n="btn_mute">mute</span>
          </button>
          <button id="btn-unmute" class="btn-rack btn-rack-unmute" type="button">
            <span class="btn-rack-inner" data-i18n="btn_on">on</span>
          </button>
        </div>
      </div>
    </div>

    <div id="volume-card" class="module module-volume">
      <div class="module-label">
        <span class="label-text" data-i18n="module_level">level</span>
        <span class="label-divider"></span>
        <span class="label-channel" data-i18n="module_level_ch">vu</span>
      </div>
      <div class="volume-body">
        <div class="volume-header">
          <span id="volume-label" class="volume-reading">-6 dB</span>
          <span id="ref-label" class="ref-label"></span>
          <div class="volume-scale">
            <span>-&#8734;</span>
            <span>-12</span>
            <span>-6</span>
            <span>-2</span>
            <span>0</span>
          </div>
        </div>
        <div class="volume-track-wrap">
          <div class="volume-track-bg"></div>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
          <div class="volume-markers">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="volume-footer">
          <label class="tie-label">
            <input type="checkbox" id="volume-zero-mutes">
            <span class="tie-switch"></span>
            <span class="tie-text" data-i18n="tie_zero_mute">zero=mute</span>
          </label>
          <label class="tie-label norm-toggle">
            <input type="checkbox" id="norm-toggle">
            <span class="tie-switch tie-switch-norm"></span>
            <span class="tie-text norm-text" data-i18n="tie_norm">norm</span>
          </label>
        </div>
      </div>
    </div>

    <div class="patch-row">
      <div id="device-card" class="module module-patch">
        <div class="module-label">
          <span class="label-text" data-i18n="module_patch">patch</span>
          <span class="label-divider"></span>
          <span class="label-channel" data-i18n="module_patch_ch">src</span>
        </div>
        <div class="patch-body">
          <select id="device-dropdown" class="patch-select"></select>
          <button id="btn-refresh-devices" class="btn-patch" type="button" title="scan">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M2 8a6 6 0 0 1 10.47-4M14 8a6 6 0 0 1-10.47 4"/>
              <path d="M13 1.5V5h-3.5M3 14.5V11h3.5"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="hotkey-card" class="module module-patch">
        <div class="module-label">
          <span class="label-text" data-i18n="module_key">key</span>
          <span class="label-divider"></span>
          <span class="label-channel" data-i18n="module_key_ch">bind</span>
        </div>
        <div class="patch-body">
          <input type="text" id="hotkey-input" class="key-input" value="F8" placeholder="key" maxlength="12">
          <button id="btn-apply-hotkey" class="btn-patch btn-patch-apply" type="button"><span data-i18n="btn_set">set</span></button>
        </div>
      </div>
    </div>

    <div id="settings-card" class="module module-settings">
      <div class="module-label">
        <span class="label-text" data-i18n="module_config">config</span>
        <span class="label-divider"></span>
        <span class="label-channel" data-i18n="module_config_ch">sys</span>
      </div>
      <div class="settings-body">
        <div class="settings-row">
          <label class="tie-label">
            <input type="checkbox" id="start-min-tray">
            <span class="tie-switch"></span>
            <span class="tie-text" data-i18n="tie_start_hidden">start hidden</span>
          </label>
          <label class="tie-label">
            <input type="checkbox" id="close-to-tray">
            <span class="tie-switch"></span>
            <span class="tie-text" data-i18n="tie_hide_on_close">hide on close</span>
          </label>
          <div class="lang-group">
            <span class="lang-indicator" data-i18n="lang_label">lang</span>
            <select id="lang-dropdown" class="lang-select">
              <option value="zh-CN">CN</option>
              <option value="en">EN</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="history-card" class="module module-log">
      <div class="module-label">
        <span class="label-text" data-i18n="module_log">log</span>
        <span class="label-divider"></span>
        <span class="label-channel" data-i18n="module_log_ch">monitor</span>
      </div>
      <div class="log-body">
        <div id="history-list" class="log-scroll"></div>
      </div>
    </div>

    <p id="tip-text" class="rack-tip" data-i18n="tip">hotkey active in background</p>

    <div class="rack-rail rack-rail-bottom"></div>

    <div class="rack-brand">mic·controller · mk-1</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
