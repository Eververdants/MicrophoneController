[package]
name = "microphonecontroller"
version = "1.0.0"
description = "Microphone control — mute, volume, device switching"
authors = ["Eververdants"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
dirs = "6"

[target.'cfg(windows)'.dependencies]
# Direct dependency because `#[interface]` (used for the undocumented
# IPolicyConfig declaration) expands to `::windows_core::` paths, which must
# resolve in this crate. Version is kept in lockstep with `windows` above.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
